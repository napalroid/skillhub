<!DOCTYPE html>
<html>
<head>
    <title>Test Category Filter</title>
    <style>
        /* Category Item - EXTREMELY SMALL padding, LARGE icon */
        .category-filter-item {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0.25rem !important;
            padding: 0.25rem 0.5rem !important;
            border-radius: 0 !important;
            background-color: #ffffff !important;
            border: 1px solid transparent !important;
            text-decoration: none !important;
            user-select: none !important;
            flex-shrink: 0 !important;
            flex-grow: 0 !important;
            min-width: auto !important;
            max-width: none !important;
        }

        .category-filter-item:hover {
            border-color: #000000 !important;
        }

        .category-filter-item.is-active {
            border-color: #000000 !important;
            background-color: #ffffff !important;
        }

        .category-icon-circle {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 10rem !important;
            height: 10rem !important;
            min-width: 10rem !important;
            min-height: 10rem !important;
            flex-grow: 0 !important;
            flex-shrink: 0 !important;
            border-radius: 0 !important;
            background-color: transparent !important;
            overflow: hidden !important;
            border: 1px solid transparent !important;
            box-shadow: none !important;
        }

        .category-icon-circle img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body>
    <div style="background-color: #ffffff;">
        <div class="inline-flex items-center gap-2 min-w-max px-0">
            <a href="#" class="category-filter-item is-active">
                <span class="category-icon-circle">
                    <img src="https://via.placeholder.com/160x160" alt="Test">
                </span>
                <span class="text-xs">Desain</span>
            </a>
            <a href="#" class="category-filter-item">
                <span class="category-icon-circle">
                    <img src="https://via.placeholder.com/160x160" alt="Test">
                </span>
                <span class="text-xs">Coding</span>
            </a>
        </div>
    </div>
</body>
</html>
